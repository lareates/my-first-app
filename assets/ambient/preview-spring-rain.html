<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>春雨车顶 · A / C 动效预览</title>
  <style>
    :root {
      --bg: #07090c;
      --ink: #e6e0de;
      --muted: rgba(230, 224, 222, 0.6);
      --line: rgba(255, 255, 255, 0.1);
      --rain-alpha: 0.55;
      --mist-min: 0.3;
      --mist-max: 0.75;
      --candle-min: 0.45;
      --candle-max: 0.95;
    }
    html.intensity-boost {
      --rain-alpha: 0.78;
      --mist-min: 0.4;
      --mist-max: 1;
      --candle-min: 0.55;
      --candle-max: 1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    }
    body { padding: 1.25rem 1.25rem 2.5rem; }
    header { max-width: 1100px; margin: 0 auto 1.25rem; }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .tab {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      padding: 0.55rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab[aria-pressed="true"] {
      border-color: rgba(160, 190, 220, 0.55);
      background: rgba(160, 190, 220, 0.16);
    }
    .hint {
      max-width: 1100px;
      margin: 0.75rem auto 0;
      padding: 0.65rem 0.85rem;
      border-radius: 0.65rem;
      background: rgba(120, 170, 220, 0.08);
      border: 1px solid rgba(120, 170, 220, 0.2);
      color: rgba(190, 215, 240, 0.9);
      font-size: 0.82rem;
    }
    .stage-wrap { max-width: 1100px; margin: 0.9rem auto 0; }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #000;
      display: none;
      /* 让雨丝 translate 可按舞台高度计算 */
      container-type: size;
    }
    .stage.is-active { display: block; }

    .bg {
      position: absolute;
      inset: -3%;
      z-index: 0;
      background-size: cover;
      background-position: center;
      will-change: transform;
    }

    /* A：图片本身缓慢放大/微移，创造呼吸感 */
    #stage-a .bg {
      transform-origin: 42% 38%;
      animation: bg-breathe 16s ease-in-out infinite;
    }
    @keyframes bg-breathe {
      0%, 100% {
        transform: scale(1.03) translate3d(0, 0, 0);
      }
      50% {
        transform: scale(1.08) translate3d(-0.6%, 0.45%, 0);
      }
    }
    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(5, 7, 12, 0.08),
        rgba(5, 7, 12, 0.2)
      );
    }

    /* —— 通用：雨丝（按容器高度下落，而不是按自身高度） —— */
    .rain-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }
    .rain-drop {
      position: absolute;
      top: 0;
      left: 0;
      width: 1.1px;
      border-radius: 999px;
      background: linear-gradient(
        to bottom,
        rgba(200, 215, 230, 0),
        rgba(200, 215, 230, 0.42),
        rgba(200, 215, 230, 0)
      );
      opacity: var(--rain-alpha);
      /* 不用高亮发光，减少「浮在图层上」的感觉 */
      mix-blend-mode: overlay;
      animation-name: rain-travel;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
      transform: translate3d(0, -20cqh, 0);
      filter: blur(0.4px);
    }
    /* 关键：百分比相对被变换元素；这里用 100cqh 相对舞台 */
    @keyframes rain-travel {
      from { transform: translate3d(0, -15cqh, 0); }
      to { transform: translate3d(var(--drift, 0px), 115cqh, 0); }
    }

    /* A：全画面细雨，融入雾气 */
    #stage-a .rain-layer {
      inset: 0;
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        #000 8%,
        #000 88%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        #000 8%,
        #000 88%,
        transparent 100%
      );
    }
    #stage-a .rain-drop {
      width: 1px;
      mix-blend-mode: overlay;
      filter: blur(0.35px);
    }
    #stage-a .mist {
      position: absolute;
      inset: -10%;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(ellipse 85% 60% at 42% 32%, rgba(170, 195, 215, 0.16), transparent 68%),
        radial-gradient(ellipse 60% 48% at 68% 58%, rgba(110, 140, 165, 0.12), transparent 70%);
      animation: mist-breathe 10s ease-in-out infinite;
      mix-blend-mode: soft-light;
      will-change: opacity;
    }
    #stage-a .mist-b {
      position: absolute;
      inset: -12%;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 62% 28%, rgba(190, 210, 225, 0.1), transparent 65%);
      animation: mist-breathe-b 14s ease-in-out infinite;
      mix-blend-mode: soft-light;
      will-change: opacity;
    }
    @keyframes mist-breathe {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.65; }
    }
    @keyframes mist-breathe-b {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.2; }
    }

    /*
      C：雨只落在各个「玻璃格」内，避开木框与猫（左下格不下雨）
    */
    #stage-c .glass-rain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    #stage-c .pane {
      position: absolute;
      overflow: hidden;
      container-type: size;
    }
    #stage-c .pane-tl { left: 20.8%; top: 7.0%;  width: 25.0%; height: 12.8%; }
    #stage-c .pane-tr { left: 49.8%; top: 7.0%;  width: 26.0%; height: 12.8%; }
    /* 中间横框（蓝框）约 20%~27%：上下窗格之间留空，不下雨 */
    #stage-c .pane-ml { left: 20.8%; top: 28.0%; width: 25.0%; height: 13.5%; }
    #stage-c .pane-mr { left: 49.8%; top: 28.0%; width: 26.0%; height: 13.5%; }
    #stage-c .pane-br { left: 49.8%; top: 45.0%; width: 26.0%; height: 13.5%; }
    #stage-c .pane .rain-drop {
      width: 1.15px;
      mix-blend-mode: overlay;
      opacity: calc(var(--rain-alpha) * 0.9);
      filter: blur(0.4px);
      animation-name: pane-rain-travel;
    }
    @keyframes pane-rain-travel {
      from { transform: translate3d(0, -25cqh, 0); }
      to { transform: translate3d(var(--drift, 1px), 130cqh, 0); }
    }

    #stage-c .candle {
      position: absolute;
      /* 对准火焰：略向左、向下 */
      left: 69.1%;
      top: 81.8%;
      width: 41px;
      height: 41px;
      margin-left: -20px;
      margin-top: -20px;
      z-index: 4;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(255, 220, 140, 0.85) 0%,
        rgba(255, 160, 60, 0.35) 32%,
        rgba(255, 100, 30, 0.08) 52%,
        transparent 68%
      );
      animation: candle-flicker 2.4s ease-in-out infinite;
      mix-blend-mode: screen;
      will-change: opacity, transform;
    }
    @keyframes candle-flicker {
      0%, 100% {
        opacity: var(--candle-min);
        transform: scale(0.88);
      }
      40% {
        opacity: var(--candle-max);
        transform: scale(1.12);
      }
      65% {
        opacity: calc((var(--candle-min) + var(--candle-max)) * 0.5);
        transform: scale(0.96);
      }
    }

    .ui-mock {
      position: absolute;
      left: 50%;
      bottom: 10%;
      transform: translateX(-50%);
      z-index: 6;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
    }
    .ui-mock .label {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      opacity: 0.75;
      margin-bottom: 0.35rem;
    }
    .ui-mock .title {
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      letter-spacing: 0.12em;
      font-weight: 500;
    }
    .ui-mock .timer {
      margin-top: 0.45rem;
      font-variant-numeric: tabular-nums;
      opacity: 0.9;
      font-size: 1rem;
    }

    .meta {
      max-width: 1100px;
      margin: 0.9rem auto 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* 调试：显示玻璃雨区域轮廓（默认关） */
    html.show-guides #stage-c .pane {
      outline: 1px dashed rgba(80, 200, 255, 0.75);
      background: rgba(80, 200, 255, 0.08);
    }
    html.show-guides #stage-c .candle {
      outline: 1px solid rgba(255, 80, 80, 0.7);
    }

    html.fx-off .rain-drop { opacity: 0 !important; animation: none !important; }
    html.fx-off .mist,
    html.fx-off .mist-b { opacity: 0.2 !important; animation: none !important; }
    html.fx-off #stage-a .bg { animation: none !important; transform: scale(1.03) !important; }
    html.fx-off .candle { opacity: 0.35 !important; animation: none !important; }

    /* 无 cqh 时的回退：用 100% 舞台高度近似 */
    @supports not (height: 1cqh) {
      @keyframes rain-travel {
        from { transform: translate3d(0, -15%, 0); }
        to { transform: translate3d(var(--drift, 0px), 1200%, 0); }
      }
      @keyframes pane-rain-travel {
        from { transform: translate3d(0, -20%, 0); }
        to { transform: translate3d(var(--drift, 1px), 1200%, 0); }
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>春雨车顶 · A / C 动效预览 v8</h1>
    <p>C：烛光略向左下微调。未部署。</p>
    <div class="tabs">
      <button class="tab" type="button" data-stage="a" aria-pressed="true">A · 松针雾雨</button>
      <button class="tab" type="button" data-stage="c" aria-pressed="false">C · 窗台黑猫</button>
      <button class="tab" type="button" id="toggle-fx" aria-pressed="true">动效：开</button>
      <button class="tab" type="button" id="toggle-intensity" aria-pressed="false">强度：成品质感</button>
      <button class="tab" type="button" id="toggle-guides" aria-pressed="false">显示定位框</button>
    </div>
  </header>

  <p class="hint">
    强制刷新：Cmd+Shift+R。点「显示定位框」可核对 C 的玻璃区 / 烛光位置是否对准。
  </p>

  <div class="stage-wrap">
    <section class="stage is-active" id="stage-a" aria-label="选项 A">
      <div class="bg" style="background-image:url('candidates/spring-rain-opt-a-needles.jpg')"></div>
      <div class="veil"></div>
      <div class="rain-layer" data-rain="a"></div>
      <div class="mist"></div>
      <div class="mist-b"></div>
      <div class="ui-mock">
        <div class="label">ACTIVE SESSION</div>
        <div class="title">春雨车顶</div>
        <div class="timer">15:00</div>
      </div>
    </section>

    <section class="stage" id="stage-c" aria-label="选项 C">
      <div class="bg" style="background-image:url('candidates/spring-rain-opt-c-cat-window.jpg')"></div>
      <div class="veil"></div>
      <div class="glass-rain">
        <div class="pane pane-tl" data-pane></div>
        <div class="pane pane-tr" data-pane></div>
        <div class="pane pane-ml" data-pane></div>
        <div class="pane pane-mr" data-pane></div>
        <div class="pane pane-br" data-pane></div>
      </div>
      <div class="candle" aria-hidden="true"></div>
      <div class="ui-mock">
        <div class="label">ACTIVE SESSION</div>
        <div class="title">春雨车顶</div>
        <div class="timer">15:00</div>
      </div>
    </section>
  </div>

  <p class="meta" id="desc">A：背景图本身缓慢放大/微移呼吸 + 细雨；辅以轻雾。</p>

  <script>
    (function () {
      document.documentElement.classList.remove('intensity-boost');

      const desc = {
        a: 'A：背景图本身缓慢放大/微移呼吸 + 细雨；辅以轻雾。',
        c: 'C：雨避开中间横框（蓝框）与猫；烛光在红圈火焰上。'
      };
      const descEl = document.getElementById('desc');

      function spawnRain(layer, count, opts) {
        layer.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const el = document.createElement('span');
          el.className = 'rain-drop';
          const left = opts.pad + (i / Math.max(1, count - 1)) * (100 - opts.pad * 2)
            + (Math.random() * 2.2 - 1.1);
          const len = opts.minLen + Math.random() * (opts.maxLen - opts.minLen);
          const dur = opts.minDur + Math.random() * (opts.maxDur - opts.minDur);
          el.style.left = left.toFixed(2) + '%';
          el.style.height = len.toFixed(1) + 'px';
          el.style.animationDuration = dur.toFixed(2) + 's';
          el.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
          el.style.setProperty('--drift', (Math.random() * opts.drift * 2 - opts.drift).toFixed(2) + 'px');
          if (opts.alphaJitter) {
            el.style.opacity = String(
              Math.max(0.2, Math.min(1, (0.7 + Math.random() * 0.5)))
            );
          }
          frag.appendChild(el);
        }
        layer.appendChild(frag);
      }

      const layerA = document.querySelector('[data-rain="a"]');
      spawnRain(layerA, 22, {
        pad: 2, minLen: 18, maxLen: 42, minDur: 5.5, maxDur: 9.5, drift: 1.8, alphaJitter: true
      });
      document.querySelectorAll('[data-pane]').forEach((pane) => {
        const n = pane.classList.contains('pane-br') ? 5 : 7;
        spawnRain(pane, n, {
          pad: 6, minLen: 18, maxLen: 40, minDur: 3.8, maxDur: 6.8, drift: 1.6, alphaJitter: true
        });
      });

      const tabs = document.querySelectorAll('.tab[data-stage]');
      tabs.forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.stage;
          tabs.forEach((b) => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
          document.querySelectorAll('.stage').forEach((s) => {
            s.classList.toggle('is-active', s.id === 'stage-' + id);
          });
          descEl.textContent = desc[id];
        });
      });

      const toggleFx = document.getElementById('toggle-fx');
      toggleFx.addEventListener('click', () => {
        const on = toggleFx.getAttribute('aria-pressed') !== 'true';
        toggleFx.setAttribute('aria-pressed', on ? 'true' : 'false');
        toggleFx.textContent = on ? '动效：开' : '动效：关';
        document.documentElement.classList.toggle('fx-off', !on);
      });

      const toggleIntensity = document.getElementById('toggle-intensity');
      toggleIntensity.addEventListener('click', () => {
        const boost = toggleIntensity.getAttribute('aria-pressed') !== 'true';
        toggleIntensity.setAttribute('aria-pressed', boost ? 'true' : 'false');
        toggleIntensity.textContent = boost ? '强度：加强预览' : '强度：成品质感';
        document.documentElement.classList.toggle('intensity-boost', boost);
      });

      const toggleGuides = document.getElementById('toggle-guides');
      toggleGuides.addEventListener('click', () => {
        const on = toggleGuides.getAttribute('aria-pressed') !== 'true';
        toggleGuides.setAttribute('aria-pressed', on ? 'true' : 'false');
        document.documentElement.classList.toggle('show-guides', on);
      });
    })();
  </script>
</body>
</html>
